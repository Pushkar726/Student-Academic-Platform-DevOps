apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-academic-platform
spec:
  replicas: 3
  selector:
    matchLabels:
      app: student-academic-platform
  template:
    metadata:
      labels:
        app: student-academic-platform
    spec:
      containers:
        - name: student-academic-platform
          image: student-academic-platform:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
